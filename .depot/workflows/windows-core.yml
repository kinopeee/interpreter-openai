# Origin / Depot CI。正本は scripts/ci-windows-core.sh。
# Depot に Windows サンドボックスが無いため、Linux で回せる Core だけを移植する。
# Platform / App / self-contained publish は GitHub Actions の windows.yml に残す。
name: windows-core

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test (windows core)
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json

      - name: Restore, build, test, and audit Core
        run: ./scripts/ci-windows-core.sh
