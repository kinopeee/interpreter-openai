# Origin + Depot CI 向け。GitHub の .github/workflows/windows.yml のうち
# Linux で実行できる Core restore/build/test/audit だけを移植する。
# Platform / App / self-contained publish は net10.0-windows のため
# .github/workflows/windows.yml に残す。
# 検査手順の正本は scripts/ci-windows-core.sh。
# 有効化: Origin リポジトリの Apps から Depot を接続し、このディレクトリを default branch へマージする。
name: windows-core

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test (windows core)
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .devin/format/tools
          key: format-csharp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/format.mjs', '.devin/format/tool-versions.json') }}

      - name: Check C# formatting
        run: node scripts/format.mjs csharp setup && node scripts/format.mjs csharp check

      - name: Restore, build, test, and audit Core
        run: ./scripts/ci-windows-core.sh
