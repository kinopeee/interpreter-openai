# Origin + Depot CI 向け。GitHub の .github/workflows/windows.yml のうち
# Linux で実行できる Core restore/build/test/audit だけを移植する。
# Platform / App / self-contained publish は net10.0-windows のため
# .github/workflows/windows.yml に残す。
# 検査手順の正本は scripts/ci-windows-core.sh。
# 有効化: Origin リポジトリの Apps から Depot を接続し、このディレクトリを default branch へマージする。
name: windows-core

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test (windows core)
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json

      - name: Restore, build, test, and audit Core
        run: ./scripts/ci-windows-core.sh
