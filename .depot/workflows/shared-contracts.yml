# Origin / Depot CI。正本は scripts/ci-shared-contracts.sh。
# GitHub 側の同名 workflow も同じスクリプトを呼ぶ。
name: shared-contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-fixtures:
    name: validate shared fixtures
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate shared contracts
        run: ./scripts/ci-shared-contracts.sh
