# macOS 26 + xcodebuild。Depot CI に macOS サンドボックスは無いため Origin へは移植しない。
# Origin 上ではローカルの xcodebuild と、タグ時の .github/workflows/release.yml が担う。
name: macos

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .devin/format/tools
          key: format-swift-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/format.mjs', '.devin/format/tool-versions.json', '.devin/format/swift-format.Package.resolved') }}

      - name: Check Swift formatting
        run: |
          set -euo pipefail
          node scripts/format.mjs swift setup
          node scripts/format.mjs swift check

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      - name: Test
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme RealtimeTranslator \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
