# macOS 26 + xcodebuild。Depot CI に macOS サンドボックスは無いため Origin へは移植しない。
# Origin 上ではローカルの xcodebuild と、タグ時の .github/workflows/release.yml が担う。
name: macos

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      - name: Test
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme RealtimeTranslator \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
