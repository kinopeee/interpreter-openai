# Windows runner 上の solution 全体（Core + Platform + App）と self-contained publish。
# Origin の PR CI は Depot に Windows サンドボックスが無いため、
# Linux で回せる Core だけ .depot/workflows/windows-core.yml へ移植している。
name: windows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test (windows)
    runs-on: windows-latest
    env:
      SOLUTION_PATH: windows/RealtimeTranslator.slnx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify solution
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:SOLUTION_PATH -PathType Leaf)) {
            Write-Host "::error::solution not found: $env:SOLUTION_PATH"
            exit 1
          }

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .devin/format/tools
          key: format-csharp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/format.mjs', '.devin/format/tool-versions.json') }}

      - name: Check C# formatting
        shell: pwsh
        run: |
          node scripts/format.mjs csharp setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/format.mjs csharp check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore
        shell: pwsh
        run: dotnet restore "$env:SOLUTION_PATH"

      - name: Build
        shell: pwsh
        run: dotnet build "$env:SOLUTION_PATH" --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test "$env:SOLUTION_PATH" --configuration Release --no-build

      - name: Audit packages
        shell: pwsh
        run: |
          dotnet list "$env:SOLUTION_PATH" package --vulnerable --include-transitive
          # dotnet list は脆弱性を見つけても終了コード 0 を返すため、機械可読な出力で判定する。
          $report = dotnet list "$env:SOLUTION_PATH" package --vulnerable --include-transitive --format json --output-version 1 |
            Out-String |
            ConvertFrom-Json
          if ($null -ne $report.problems -and @($report.problems).Count -gt 0) {
            throw "dotnet list package reported $(@($report.problems).Count) problem(s)"
          }
          $vulnerabilityCount = 0
          foreach ($project in @($report.projects)) {
            foreach ($framework in @($project.frameworks)) {
              foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                if ($null -eq $package) { continue }
                $vulnerabilityCount += @($package.vulnerabilities).Count
              }
            }
          }
          if ($vulnerabilityCount -gt 0) {
            throw "vulnerable packages found: $vulnerabilityCount advisory binding(s)"
          }

      - name: Restore for publish
        shell: pwsh
        run: dotnet restore "$env:SOLUTION_PATH" --runtime win-x64

      - name: Publish self-contained app
        shell: pwsh
        run: ./scripts/publish-windows.ps1 -Runtime win-x64 -NoRestore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RealtimeTranslator-win-x64
          path: artifacts/RealtimeTranslator-win-x64
          if-no-files-found: error
