name: windows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Locate solution
        id: locate
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Path 'windows' -Include '*.sln', '*.slnx' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $solution) {
            Write-Host 'No windows solution yet; skipping build.'
            "found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "path=$($solution.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - uses: actions/setup-dotnet@v4
        if: steps.locate.outputs.found == 'true'
        with:
          global-json-file: windows/global.json

      - name: Restore
        if: steps.locate.outputs.found == 'true'
        run: dotnet restore "${{ steps.locate.outputs.path }}"

      - name: Build
        if: steps.locate.outputs.found == 'true'
        run: dotnet build "${{ steps.locate.outputs.path }}" --configuration Release --no-restore

      - name: Test
        if: steps.locate.outputs.found == 'true'
        run: dotnet test "${{ steps.locate.outputs.path }}" --configuration Release --no-build

      - name: Audit packages
        if: steps.locate.outputs.found == 'true'
        shell: pwsh
        run: |
          dotnet list "${{ steps.locate.outputs.path }}" package --vulnerable --include-transitive
          # dotnet list は脆弱性を見つけても終了コード 0 を返すため、機械可読な出力で判定する。
          # 脆弱性がない project では frameworks が出力されない。
          $report = dotnet list "${{ steps.locate.outputs.path }}" package --vulnerable --include-transitive --format json |
            Out-String |
            ConvertFrom-Json
          $vulnerable = @($report.projects | Where-Object { $null -ne $_.frameworks })
          if ($vulnerable.Count -gt 0) {
            throw "vulnerable packages found in $($vulnerable.Count) project(s)"
          }

      - name: Publish self-contained app
        if: steps.locate.outputs.found == 'true'
        shell: pwsh
        run: ./scripts/publish-windows.ps1 -Output artifacts/RealtimeTranslator-win-x64

      - uses: actions/upload-artifact@v4
        if: steps.locate.outputs.found == 'true'
        with:
          name: RealtimeTranslator-win-x64
          path: artifacts/RealtimeTranslator-win-x64
          if-no-files-found: error
