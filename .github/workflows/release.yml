name: release

on:
  push:
    tags: ['v*']
  pull_request:
    # 配布物の作成経路が壊れていないことをタグを打つ前に確認する（Releaseは作らない）。
    paths:
      - '.github/workflows/release.yml'
      - '.github/release-notes.md'
      - 'scripts/publish-windows.ps1'
      - 'scripts/ci-macos-codesign.sh'
      - 'project.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースするタグ名 (例: v0.1.0)。事前にタグを push しておくこと'
        required: true

permissions:
  contents: read

jobs:
  version:
    name: resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      app_version: ${{ steps.resolve.outputs.app_version }}
    steps:
      - name: Resolve release tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            # PR では Release を作らず、artifact 名用の仮タグだけ付ける。
            echo "tag=pr${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "app_version=0.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ZIP パスに使える文字だけ許可（区切り・traversal を拒否）。
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*$ ]]; then
            echo "release tag must look like v0.1.0 (no path separators): $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # バイナリへ焼く SemVer。タグの v 接頭辞と -rc 等の接尾辞は MARKETING_VERSION から外す。
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "could not read X.Y.Z from release tag: $tag" >&2
            exit 1
          fi
          echo "app_version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  windows:
    name: package (win-x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 手動実行では起動元ブランチでなく、リリースするタグのコードをビルドする。
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json

      # setup-dotnet の global-json-file は SDK インストール先だけ決め、CLI の CWD 探索は変えない。
      # windows/global.json を効かせるため、dotnet 系は windows/ から実行する。
      - name: Test
        working-directory: windows
        shell: pwsh
        run: dotnet test RealtimeTranslator.slnx --configuration Release

      - name: Restore for publish
        working-directory: windows
        shell: pwsh
        run: dotnet restore RealtimeTranslator.slnx --runtime win-x64

      - name: Publish self-contained app
        working-directory: windows
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.version.outputs.app_version }}
        # publish-windows.ps1 は PSScriptRoot からリポジトリルートを解決する。
        run: ../scripts/publish-windows.ps1 -Runtime win-x64 -NoRestore -Version $env:APP_VERSION

      - name: Verify baked app version
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.version.outputs.app_version }}
        run: |
          $exe = 'artifacts/RealtimeTranslator-win-x64/RealtimeTranslator.App.exe'
          $info = (Get-Item $exe).VersionInfo
          $product = [string]$info.ProductVersion
          $file = [string]$info.FileVersion
          # FileVersion は 0.1.0.0、ProductVersion は 0.1.0 / 0.1.0+meta があり得る。
          # StartsWith だと 0.1.00 なども通るため、任意の .0 と +metadata だけを許して終端まで合わせる。
          $versionPattern = '^' + [regex]::Escape($env:APP_VERSION) + '(?:\.0)?(?:\+.*)?$'
          if ($product -notmatch $versionPattern) {
            throw "ProductVersion '$product' must match '$($env:APP_VERSION)' (optional .0 or +metadata)"
          }
          if ($file -notmatch $versionPattern) {
            throw "FileVersion '$file' must match '$($env:APP_VERSION)' (optional .0 or +metadata)"
          }

      - name: Package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          $zip = "artifacts/RealtimeTranslator-$env:RELEASE_TAG-win-x64.zip"
          Compress-Archive -Path 'artifacts/RealtimeTranslator-win-x64/*' -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($zip))" | Out-File "$zip.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: release-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          if-no-files-found: error

  macos:
    name: package (macOS arm64)
    needs: version
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve macOS signing mode
        id: sign
        env:
          EVENT_NAME: ${{ github.event_name }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          set -euo pipefail
          # PR dry-run は secrets 無しでも通す（ad-hoc / 公証スキップ）。
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "pull_request: using ad-hoc signing; notarization skipped."
            exit 0
          fi

          missing=()
          for name in \
            MACOS_CERTIFICATE_P12_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_KEY_P8
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Developer ID sign/notarize requires these GitHub Actions secrets:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            echo "Optional: MACOS_DEVELOPER_ID_IDENTITY, MACOS_TEAM_ID (default D8YZR4M6QB)" >&2
            exit 1
          fi
          echo "mode=developer-id" >> "$GITHUB_OUTPUT"
          echo "tag/workflow_dispatch: Developer ID signing and notarization enabled."

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      - name: Test
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme RealtimeTranslator \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Import Developer ID certificate
        if: steps.sign.outputs.mode == 'developer-id'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_ID_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_IDENTITY }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          ./scripts/ci-macos-codesign.sh import-keychain

      - name: Build
        env:
          SIGN_MODE: ${{ steps.sign.outputs.mode }}
          APP_VERSION: ${{ needs.version.outputs.app_version }}
          MACOS_DEVELOPER_ID_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_IDENTITY }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          version_flags=(
            "MARKETING_VERSION=${APP_VERSION}"
            "CURRENT_PROJECT_VERSION=${APP_VERSION}"
          )
          if [[ "$SIGN_MODE" == "developer-id" ]]; then
            identity="${MACOS_DEVELOPER_ID_IDENTITY:-${CODESIGN_IDENTITY:-}}"
            team_id="${MACOS_TEAM_ID:-${CODESIGN_TEAM_ID:-D8YZR4M6QB}}"
            if [[ -z "$identity" ]]; then
              echo "CODESIGN_IDENTITY was not set after keychain import" >&2
              exit 1
            fi
            if [[ -z "${CODESIGN_KEYCHAIN_PATH:-}" ]]; then
              echo "CODESIGN_KEYCHAIN_PATH was not set after keychain import" >&2
              exit 1
            fi
            ./scripts/ci-macos-codesign.sh unlock-keychain
            # 一時キーチェーンを明示し、公証に必要な secure timestamp を付与する。
            xcodebuild build \
              -scheme RealtimeTranslator \
              -configuration Release \
              -destination 'platform=macOS' \
              -derivedDataPath build/DerivedDataRelease \
              ARCHS=arm64 \
              ONLY_ACTIVE_ARCH=NO \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="$identity" \
              DEVELOPMENT_TEAM="$team_id" \
              CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
              OTHER_CODE_SIGN_FLAGS="--timestamp --keychain ${CODESIGN_KEYCHAIN_PATH}" \
              "${version_flags[@]}"
          else
            # PR dry-run: CIに証明書が無くても配布zip経路を検証できるようad-hoc署名する。
            xcodebuild build \
              -scheme RealtimeTranslator \
              -configuration Release \
              -destination 'platform=macOS' \
              -derivedDataPath build/DerivedDataRelease \
              ARCHS=arm64 \
              ONLY_ACTIVE_ARCH=NO \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY=- \
              DEVELOPMENT_TEAM= \
              CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
              "${version_flags[@]}"
          fi

      - name: Verify the audio input entitlement
        run: |
          set -euo pipefail
          app="build/DerivedDataRelease/Build/Products/Release/RealtimeTranslator.app"
          # entitlementsが欠けるとマイク許可済みでもrequestAccessが拒否されるため、配布前に必ず確認する。
          codesign -d --entitlements :- --xml "$app" > entitlements.xml
          value=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' entitlements.xml)
          if [[ "$value" != "true" ]]; then
            echo "com.apple.security.device.audio-input must be true, got: $value" >&2
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.get-task-allow' entitlements.xml >/dev/null 2>&1; then
            echo "com.apple.security.get-task-allow must not be present in Release builds" >&2
            exit 1
          fi

      - name: Verify baked app version
        env:
          APP_VERSION: ${{ needs.version.outputs.app_version }}
        run: |
          set -euo pipefail
          app="build/DerivedDataRelease/Build/Products/Release/RealtimeTranslator.app"
          plist="$app/Contents/Info.plist"
          short=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
          if [[ "$short" != "$APP_VERSION" ]]; then
            echo "CFBundleShortVersionString must be $APP_VERSION, got: $short" >&2
            exit 1
          fi
          if [[ "$build" != "$APP_VERSION" ]]; then
            echo "CFBundleVersion must be $APP_VERSION, got: $build" >&2
            exit 1
          fi

      - name: Notarize and staple
        if: steps.sign.outputs.mode == 'developer-id'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          set -euo pipefail
          app="build/DerivedDataRelease/Build/Products/Release/RealtimeTranslator.app"
          ./scripts/ci-macos-codesign.sh notarize-staple "$app"

      - name: Package
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          app="build/DerivedDataRelease/Build/Products/Release/RealtimeTranslator.app"
          zip="artifacts/RealtimeTranslator-${RELEASE_TAG}-macos-arm64.zip"
          # ditto はbundleの拡張属性と署名を保ったままzip化できる（Compress-Archive相当のzipでは壊れる）。
          # staple 後に最終zipを作る（公証チケットをzip内へ含める）。
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          shasum -a 256 "$zip" | sed "s|artifacts/||" > "$zip.sha256"

      - name: Clean up signing materials
        if: always() && steps.sign.outputs.mode == 'developer-id'
        run: |
          set -euo pipefail
          ./scripts/ci-macos-codesign.sh cleanup

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          if-no-files-found: error

  release:
    name: create release
    needs: [version, windows, macos]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(artifacts/*)
          if (( ${#assets[@]} == 0 )); then
            echo 'no release assets under artifacts/' >&2
            exit 1
          fi
          # 部分失敗後の再実行でもアセットを置き換えられるようにする。
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            # --verify-tag: 存在しないタグ名で既定ブランチにタグが新規作成されるのを防ぐ。
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --title "Realtime Translator $RELEASE_TAG" \
              --notes-file .github/release-notes.md
          fi
