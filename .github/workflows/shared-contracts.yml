name: shared-contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-fixtures:
    name: validate shared fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate fixtures against JSON Schema
        run: ./scripts/ci-shared-contracts.sh fixtures

      - name: Validate UI locale catalog
        run: ./scripts/ci-shared-contracts.sh locales
