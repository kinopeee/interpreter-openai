name: shared-contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-fixtures:
    name: validate shared fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate fixtures against JSON Schema
        working-directory: shared/fixtures/v1
        run: |
          set -euo pipefail
          status=0
          for schema in schema/*.schema.json; do
            name="$(basename "$schema" .schema.json)"
            if [ ! -f "$name.json" ]; then
              echo "::error::missing fixture $name.json for $schema"
              status=1
              continue
            fi
            npx --yes ajv-cli@5.0.0 validate --spec=draft2020 -s "$schema" -d "$name.json" || status=1
          done
          for fixture in *.json; do
            name="$(basename "$fixture" .json)"
            if [ ! -f "schema/$name.schema.json" ]; then
              echo "::error::missing schema for $fixture"
              status=1
            fi
          done
          exit "$status"

      - name: Validate UI locale catalog
        working-directory: shared/locales
        run: |
          set -euo pipefail
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 -s ui.schema.json -d ui.json
          node -e '
            const fs = require("fs");
            const catalog = JSON.parse(fs.readFileSync("ui.json", "utf8"));
            const keys = catalog.strings.map((item) => item.key);
            const seen = new Set();
            const duplicates = [];
            for (const key of keys) {
              if (seen.has(key)) duplicates.push(key);
              seen.add(key);
            }
            if (duplicates.length) {
              console.error("duplicate keys:", duplicates.join(", "));
              process.exit(1);
            }
            const names = (text) => new Set(
              [...text.matchAll(/\{([A-Za-z_][A-Za-z0-9_]*)\}/g)].map((match) => match[1])
            );
            let failed = false;
            for (const item of catalog.strings) {
              const ja = names(item.ja);
              const en = names(item.en);
              if (ja.size !== en.size || [...ja].some((name) => !en.has(name))) {
                console.error("placeholder mismatch:", item.key);
                failed = true;
              }
            }
            if (failed) process.exit(1);
            console.log("ok:", keys.length, "keys");
          '
