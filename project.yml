name: RealtimeTranslator
options:
  bundleIdPrefix: com.realtimetranslator
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: D8YZR4M6QB
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  RealtimeTranslator:
    type: application
    platform: macOS
    sources:
      - path: RealtimeTranslator
        excludes:
          - Tests/**
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.realtimetranslator.app
        PRODUCT_NAME: RealtimeTranslator
        INFOPLIST_FILE: RealtimeTranslator/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Carbon"
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    entitlements:
      path: RealtimeTranslator/RealtimeTranslator.entitlements
      properties:
        com.apple.security.device.audio-input: true
    info:
      path: RealtimeTranslator/Info.plist
      properties:
        CFBundleName: RealtimeTranslator
        CFBundleDisplayName: Realtime Translator
        CFBundleIdentifier: com.realtimetranslator.app
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSMicrophoneUsageDescription: リアルタイム翻訳字幕を生成するため、マイク音声をOpenAI APIへ送信します。
        NSPrincipalClass: NSApplication
  RealtimeTranslatorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RealtimeTranslator/Tests
    dependencies:
      - target: RealtimeTranslator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.realtimetranslator.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RealtimeTranslator.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RealtimeTranslator"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  RealtimeTranslator:
    build:
      targets:
        RealtimeTranslator: all
        RealtimeTranslatorTests: [test]
    test:
      targets:
        - RealtimeTranslatorTests
